name = "bantou"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 定期実行（UTC）: 23:00 = 日本時間 8:00 清掃通知 / 00:00 = 日本時間 9:00 納品反映
[triggers]
crons = ["0 23 * * *", "0 0 * * *", "*/5 * * * *", "0 22 * * *", "0 9 * * *"]  # 5分ごと = ゲストメッセージ確認 / 22:00・09:00 UTC = 日本時間 7:00・18:00 TimeTree同期

# 承認カード・FAQ・学習例の保存先（ダッシュボードで作った KV namespace の ID を入れる）
[[kv_namespaces]]
binding = "KV"
id = "d9ecde121a0b4b88be97f0d7afea0541"

# TimeTree同期用（Browser Rendering。Workers有料プランが必要）
[browser]
binding = "BROWSER"

[observability]
enabled = true

# 公開してよい設定値はここ。秘密情報は wrangler secret put か、ダッシュボードの Secrets に入れる。
[vars]
# GAS（スプレッドシートAPI）のWebアプリURL。ダッシュボードの値と一致させること
GAS_URL = "https://script.google.com/macros/s/AKfycbwwbxAlixxKSqeCm2mzyxudFfMT--nN3QJNMA5u6spBK6Wt_VldNy250mqnfQbYoYLN/exec"
# 清掃通知の送信先（LINEグループID）
LINE_GROUP_FUJINOMIYA_WEEKDAY = "Ca92b75ce78903864c58694356db208d5"
LINE_GROUP_FUJINOMIYA_HOLIDAY = "Cc2aca0da850e46dfd12c4179364fbbd9"
LINE_GROUP_SHIZUOKA = "C7656ee7a6c9e66e39154ccf05a9e76a3"
# 管理者（エラー通知・納品反映の送り先）
OWNER_USER_ID = "Ubd034e0134bddb7d012c4ecf94c91bd4"
# 一言返し（お礼・到着報告への短い返事）を自動送信するか。"on" 以外はカードで確認
AUTO_ACK = "off"
# TimeTree同期: off | dry（計算のみ）| add（追加のみ）| full（削除・変更も）。対象物件は TIMETREE_PROPS（カンマ区切り）
TIMETREE_SYNC = "off"
TIMETREE_PROPS = "nel.shizuoka"

# 必要な Secrets（wrangler secret put <NAME>）:
#   HARU_CHANNEL_SECRET, HARU_CHANNEL_ACCESS_TOKEN   … 清掃用（旧デジタル番頭）
#   SORA_CHANNEL_SECRET, SORA_CHANNEL_ACCESS_TOKEN   … 管理用（旧 明日想い）
#   BEDS24_REFRESH_TOKEN
#   ANTHROPIC_API_KEY   … Claude API（承認カードの返信案）
# 任意の Variables:
#   SORA_TARGET_ID … 承認カードの送り先（未設定なら OWNER_USER_ID）
